<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#0A1F44">
<title>ENTRIX Product Photos v1.4</title>
<style>
:root{--navy:#0A1F44;--amber:#F2A900;--bg:#f3f5f9;--line:#e1e5ec;--txt:#1b2333;--mut:#6b7486;--red:#c62828;--wa:#25D366}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:15px;padding-bottom:90px}
button{font-family:inherit}
#hdr{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff}
.hrow{display:flex;align-items:center;gap:4px;padding:8px 8px 6px 12px}
.t{flex:1;font-weight:700;font-size:16px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t small{display:block;font-weight:400;font-size:11px;color:var(--amber)}
.hb{background:none;border:0;color:#fff;font-size:20px;padding:6px 10px;cursor:pointer}
#srch{padding:0 12px 10px}
#srch input{width:100%;padding:9px 12px;border-radius:8px;border:0;font-size:15px}
.row{display:flex;align-items:center;gap:10px;background:#fff;border-bottom:1px solid var(--line);padding:7px 12px;cursor:pointer}
.row img,.row .ph{width:46px;height:46px;border-radius:6px;object-fit:cover;background:#dde2ea;flex:none}
.row .n{flex:1;font-weight:600;min-width:0}
.row .c{color:var(--mut);font-size:13px;white-space:nowrap}
.row.empty{opacity:.55}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px}
@media(min-width:700px){.grid{grid-template-columns:repeat(5,1fr)}}
.tile{position:relative;background:#dde2ea;aspect-ratio:1/1;overflow:hidden;cursor:pointer}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.8));color:#fff;font-size:11px;padding:14px 4px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .chk{display:none;position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.35);color:var(--navy);font-weight:900;text-align:center;line-height:20px;font-size:14px}
.selmode .tile .chk{display:block}
.tile.sel .chk{background:var(--amber)}
.tile.sel img{opacity:.75}
.msg{padding:30px 16px;text-align:center;color:var(--mut)}
.sec{padding:10px 12px 4px;font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase}
#fab{position:fixed;right:16px;bottom:18px;background:var(--amber);color:var(--navy);border:0;border-radius:28px;padding:14px 20px;font-weight:800;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:15;cursor:pointer}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--navy);color:#fff;display:flex;gap:8px;padding:10px 12px;align-items:center;z-index:16}
#bar .n{flex:1;font-weight:700}
.btn{border:0;border-radius:8px;padding:11px 14px;font-weight:700;font-size:15px;cursor:pointer;background:#e7ebf2;color:var(--txt)}
.btn.pri{background:var(--navy);color:#fff}
.btn.amb{background:var(--amber);color:var(--navy)}
.btn.wa{background:var(--wa);color:#fff}
.btn.red{background:var(--red);color:#fff}
.btn:disabled{opacity:.45}
.btn.full{width:100%}
.ov{position:fixed;inset:0;background:rgba(10,20,40,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.box{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px}
@media(min-width:600px){.ov{align-items:center}.box{border-radius:14px}}
.box h3{margin:0 0 12px;color:var(--navy)}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:10px 0 4px}
input[type=text],input[type=password],input[type=tel],select,textarea{width:100%;padding:10px;border:1px solid #c9d0db;border-radius:8px;font-size:15px;font-family:inherit;background:#fff}
textarea{min-height:60px;resize:vertical}
.btns{display:flex;gap:8px;margin-top:14px}
.btns .btn{flex:1}
.pick{display:flex;gap:8px}
.pick .btn{flex:1}
.prev{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.prev img{width:56px;height:56px;object-fit:cover;border-radius:4px}
.chkl{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px}
.viewer{position:fixed;inset:0;background:#000;z-index:40;display:flex;flex-direction:column}
.vtop{display:flex;align-items:center;color:#fff;padding:6px}
.vtop .t{font-size:14px;font-weight:600}
.vimg{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0}
.vimg img{max-width:100%;max-height:100%;object-fit:contain}
.nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.15);border:0;color:#fff;font-size:26px;width:44px;height:60px;cursor:pointer}
.nav.l{left:0;border-radius:0 8px 8px 0}.nav.r{right:0;border-radius:8px 0 0 8px}
.vinfo{background:#111;color:#eee;padding:10px 12px}
.vinfo b{color:#fff;font-size:16px}
.vinfo .d{font-size:13px;white-space:pre-wrap;margin-top:2px}
.vinfo .m{font-size:12px;color:#999;margin-top:4px}
.vbtns{display:flex;gap:8px;padding:8px 12px 14px;background:#111}
.vbtns .btn{flex:1;padding:12px 6px}
.vbtns .btn.sm{flex:0 0 46px;padding:12px 0}
#busy{position:fixed;inset:0;background:rgba(10,20,40,.65);z-index:90;display:none;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;text-align:center;padding:20px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;z-index:95;display:none;max-width:90%;font-size:14px;text-align:center}
.login{max-width:380px;margin:0 auto;padding:40px 20px}
.logo{text-align:center;margin-bottom:24px}
.logo .a{font-size:28px;font-weight:900;color:var(--navy);letter-spacing:1px}
.logo .a span{color:var(--amber)}
.logo .b{color:var(--mut);font-size:14px}
.err{color:var(--red);font-size:14px;margin-top:8px;min-height:18px}
.crow{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
.crow .n{flex:1}
.crow .c{color:var(--mut);font-size:12px}
.ib{border:0;background:#eef1f6;border-radius:6px;padding:6px 9px;font-size:15px;cursor:pointer}
.ib:disabled{opacity:.3}
#printArea{display:none}
@media print{body{padding:0;background:#fff}body>*:not(#printArea){display:none!important}#printArea{display:block}
.pp{page-break-after:always;font-family:Arial,sans-serif;color:#000;padding:4mm}.pp:last-child{page-break-after:auto}
.pph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #F2A900;padding-bottom:4px;margin-bottom:8px}
.pph b{font-size:20px;color:#0A1F44}.pph span{font-size:11px;text-align:right}
.pp img{display:block;max-width:100%;max-height:70vh;margin:0 auto;object-fit:contain}
.ppt{font-size:17px;font-weight:bold;margin-top:8px}.ppd{font-size:13px;white-space:pre-wrap;margin-top:3px}.ppc{font-size:11px;color:#555;margin-top:4px}}
.banner{background:#fdecea;color:#b71c1c;border-left:4px solid #c62828;padding:10px 12px;font-size:13px;margin:8px;border-radius:6px}
</style>
</head>
<body>
<div id="hdr"><div class="hrow" id="hrow"></div><div id="srch" style="display:none"><input id="q" type="search" placeholder="🔍 Search product name / details…" autocomplete="off"></div></div>
<div id="main"></div>
<button id="fab" style="display:none">＋ Upload</button>
<div id="bar" style="display:none"></div>
<div id="busy"></div>
<div id="toast"></div>
<div id="printArea"></div>
<script>
/* ===== CONFIG ===== */
const APP_VERSION = 'v1.4';                          // update on every release
const APP_DATE = '11 Nov 2026';
const PROJECT = 'entrix-product-photos';            // Separate Firebase project for product photos
const COL = 'productPhotos';                         // one document per photo
const CFG_PATH = 'productCatalog/config';            // categories + sales PIN
const ADMIN_PIN = '1234';
const DEFAULT_SALES_PIN = '5555';
const CO = {name:'ENTRIX Innovation', phone:'+91 95525 52667', web:'entrix.co.in'};
const DEFAULT_CATS = ['Solar Street Lights','LED Street Lights','LED Flood Lights','Solar High Mast','High Mast Poles','Octagonal Poles','Designer / Decorative Poles','Solar Water Pumps','Solar Camera Systems','Cast Iron Benches','Garbage Vehicles','Fabricated Structures','Site Installations'];
const ROOT = `https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents`;
const DOCNAME = id => `projects/${PROJECT}/databases/(default)/documents/${COL}/${id}`;

/* ===== STATE ===== */
const S = {user:null, cfg:{cats:DEFAULT_CATS.slice(), salesPin:DEFAULT_SALES_PIN}, photos:[], view:'home', cat:null, q:'', selMode:false, sel:new Set(), list:[]};
const THUMB = {}, FULL = {};
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isAdmin = () => S.user && S.user.role==='admin';
const fmtDate = t => t ? new Date(t).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}) : '';
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

/* ===== UI HELPERS ===== */
let toastT;
function toast(m,ms){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',ms||2800)}
function busy(m){const b=$('#busy');b.textContent=m;b.style.display='flex'}
function busyOff(){$('#busy').style.display='none'}

/* Back-button aware overlay stack (Android back closes the top overlay) */
const navStack=[]; const popWaiters=[];
function pushNav(closeFn){navStack.push(closeFn);history.pushState({n:navStack.length},'')}
window.addEventListener('popstate',()=>{const f=navStack.pop();if(f)f();const w=popWaiters.shift();if(w)w()});
function closeTop(){return new Promise(r=>{popWaiters.push(r);history.back()})}

function modal(inner){
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="box">${inner}</div>`;
  ov.addEventListener('click',e=>{if(e.target===ov)closeTop()});
  document.body.appendChild(ov);
  pushNav(()=>ov.remove());
  return ov;
}
function confirmBox(title,text,okLabel,okCls,onOk){
  const ov=modal(`<h3>${esc(title)}</h3><div>${esc(text)}</div><div class="btns"><button class="btn" data-x>Cancel</button><button class="btn ${okCls}" data-ok>${esc(okLabel)}</button></div>`);
  ov.querySelector('[data-x]').onclick=()=>closeTop();
  ov.querySelector('[data-ok]').onclick=()=>{onOk();closeTop()};
}
function promptBox(title,val,onOk){
  const ov=modal(`<h3>${esc(title)}</h3><input type="text" id="pb" value="${esc(val)}"><div class="btns"><button class="btn" data-x>Cancel</button><button class="btn pri" data-ok>Save</button></div>`);
  const inp=ov.querySelector('#pb');setTimeout(()=>inp.focus(),50);
  ov.querySelector('[data-x]').onclick=()=>closeTop();
  ov.querySelector('[data-ok]').onclick=async()=>{const v=inp.value.trim();if(!v)return;await closeTop();onOk(v)};
}

/* ===== FIRESTORE (REST) ===== */
function enc(o){const f={};for(const k in o){const v=o[k];if(v==null)continue;
  if(typeof v==='number')f[k]={integerValue:String(Math.round(v))};
  else if(Array.isArray(v))f[k]={arrayValue:{values:v.map(s=>({stringValue:String(s)}))}};
  else f[k]={stringValue:String(v)}}return{fields:f}}
function dec(d){const o={id:d.name.split('/').pop()};const f=d.fields||{};for(const k in f){const v=f[k];
  if('stringValue' in v)o[k]=v.stringValue;else if('integerValue' in v)o[k]=+v.integerValue;
  else if('doubleValue' in v)o[k]=v.doubleValue;else if('arrayValue' in v)o[k]=(v.arrayValue.values||[]).map(x=>x.stringValue)}return o}
async function api(url,opt){
  const r=await fetch(url,opt||{});
  if(r.status===404)return null;
  if(!r.ok){let m='HTTP '+r.status;try{const j=await r.json();if(j.error&&j.error.message)m=j.error.message}catch(e){}
    if(r.status===403)m='PERMISSION_DENIED — Firestore rules must allow the "productPhotos" and "productCatalog" collections.';
    throw new Error(m)}
  const tx=await r.text();return tx?JSON.parse(tx):{};
}
const JSONH={'Content-Type':'application/json'};
const maskQ=(key,fields)=>fields.map(f=>`&${key}.fieldPaths=${f}`).join('');

async function listPhotos(){
  const out=[];let tok='';
  do{const j=await api(`${ROOT}/${COL}?pageSize=300${maskQ('mask',['cat','title','details','by','at'])}${tok?'&pageToken='+encodeURIComponent(tok):''}`);
    if(!j)break;(j.documents||[]).forEach(d=>out.push(dec(d)));tok=j.nextPageToken||''}while(tok);
  return out.sort((a,b)=>(b.at||0)-(a.at||0));
}
async function batchGet(ids,field,chunk){
  const out={};
  for(let i=0;i<ids.length;i+=chunk){
    const r=await api(`${ROOT}:batchGet`,{method:'POST',headers:JSONH,body:JSON.stringify({documents:ids.slice(i,i+chunk).map(DOCNAME),mask:{fieldPaths:[field]}})});
    (r||[]).forEach(x=>{if(x.found){const o=dec(x.found);if(o[field])out[o.id]=o[field]}});
  }
  return out;
}
const savePhoto=(id,o)=>api(`${ROOT}/${COL}/${id}`,{method:'PATCH',headers:JSONH,body:JSON.stringify(enc(o))});
const updPhoto=(id,o)=>api(`${ROOT}/${COL}/${id}?${maskQ('updateMask',Object.keys(o)).slice(1)}`,{method:'PATCH',headers:JSONH,body:JSON.stringify(enc(o))});
const delPhoto=id=>api(`${ROOT}/${COL}/${id}`,{method:'DELETE'});

async function getCfg(){const j=await api(`${ROOT}/${CFG_PATH}`);if(!j)return null;const c=dec(j);
  return{cats:Array.isArray(c.cats)&&c.cats.length?c.cats:DEFAULT_CATS.slice(),salesPin:c.salesPin||DEFAULT_SALES_PIN}}
async function ensureCfg(){
  let c=await getCfg();
  if(!c){try{await api(`${ROOT}/${CFG_PATH}?currentDocument.exists=false`,{method:'PATCH',headers:JSONH,body:JSON.stringify(enc({cats:DEFAULT_CATS,salesPin:DEFAULT_SALES_PIN}))})}catch(e){}
    c=await getCfg()||{cats:DEFAULT_CATS.slice(),salesPin:DEFAULT_SALES_PIN}}
  return c;
}
async function putCfg(c){await api(`${ROOT}/${CFG_PATH}?${maskQ('updateMask',['cats','salesPin']).slice(1)}`,{method:'PATCH',headers:JSONH,body:JSON.stringify(enc({cats:c.cats,salesPin:c.salesPin}))})}
/* Merge-safe config edit: always re-read latest cloud copy before changing */
async function editCfg(fn){const c=(await getCfg())||S.cfg;fn(c);await putCfg(c);S.cfg=c;lsSet('epCfg',c)}

/* ===== IMAGE CACHE (IndexedDB, images never change once uploaded) ===== */
const idb=(()=>{let db;
  const open=()=>db?Promise.resolve(db):new Promise((res,rej)=>{const r=indexedDB.open('entrixPhotos',1);r.onupgradeneeded=()=>r.result.createObjectStore('img');r.onsuccess=()=>{db=r.result;res(db)};r.onerror=()=>rej(r.error)});
  return{
    async get(k){try{const d=await open();return await new Promise(res=>{const q=d.transaction('img').objectStore('img').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined)})}catch(e){return undefined}},
    async set(k,v){try{const d=await open();d.transaction('img','readwrite').objectStore('img').put(v,k)}catch(e){}},
    async del(k){try{const d=await open();d.transaction('img','readwrite').objectStore('img').delete(k)}catch(e){}}
  }})();
function applyThumb(id){document.querySelectorAll(`img[data-t="${id}"]`).forEach(i=>{if(!i.src)i.src='data:image/jpeg;base64,'+THUMB[id]})}
async function loadImgs(ids,kind){
  const mem=kind==='thumb'?THUMB:FULL, need=[];
  for(const id of ids){if(mem[id]){if(kind==='thumb')applyThumb(id);continue}
    const v=await idb.get(kind+':'+id);if(v){mem[id]=v;if(kind==='thumb')applyThumb(id)}else need.push(id)}
  if(!need.length)return;
  const got=await batchGet(need,kind,kind==='thumb'?100:4);
  for(const id in got){mem[id]=got[id];idb.set(kind+':'+id,got[id]);if(kind==='thumb')applyThumb(id)}
}
const fillThumbs=ids=>loadImgs(ids,'thumb').catch(e=>toast('Photo load error: '+e.message));
const loadFull=ids=>loadImgs(ids,'full');

/* ===== IMAGE PROCESSING ===== */
function readImg(file){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Cannot read '+file.name));i.src=URL.createObjectURL(file)})}
function toJpeg(img,max,q,mark){
  const r=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
  const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*r);c.height=Math.round(img.naturalHeight*r);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
  if(mark){const fs=Math.max(14,Math.round(c.width*0.028));x.font=`bold ${fs}px sans-serif`;const txt=`${CO.name}  |  ${CO.phone}`;
    const w=x.measureText(txt).width,p=fs*0.5,h=fs*1.6;x.fillStyle='rgba(10,31,68,0.72)';x.fillRect(c.width-w-p*3,c.height-h-p,w+p*2,h);
    x.fillStyle='#F2A900';x.textBaseline='middle';x.fillText(txt,c.width-w-p*2,c.height-p-h/2)}
  return c.toDataURL('image/jpeg',q).split(',')[1];
}
async function processFile(f,mark){
  const img=await readImg(f);let max=1600,q=0.82,full=toJpeg(img,max,q,mark);
  while(full.length>700000&&max>500){q=Math.max(0.5,q-0.08);max=Math.round(max*0.85);full=toJpeg(img,max,q,mark)}
  const thumb=toJpeg(img,300,0.6,false);URL.revokeObjectURL(img.src);return{full,thumb};
}
function b64blob(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return new Blob([u],{type:'image/jpeg'})}
const slug=s=>String(s).replace(/[^a-z0-9]+/gi,'_').replace(/^_|_$/g,'').slice(0,40)||'photo';
const fname=(p,i)=>`ENTRIX_${slug(p.title)}_${i+1}.jpg`;

/* ===== SHARE TO WHATSAPP ===== */
function caption(items){
  let s=`*${CO.name}*\n`;
  if(items.length===1){const p=items[0];s+=`*${p.title}*`+(p.details?`\n${p.details}`:'')}
  else{const seen=new Set();items.forEach(p=>{if(seen.has(p.title))return;seen.add(p.title);s+=`\n• *${p.title}*`+(p.details?` — ${p.details.replace(/\n+/g,', ')}`:'')})}
  return s+`\n\n📞 ${CO.phone}\n🌐 ${CO.web}\n— ${S.user.name}`;
}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
function doShare(items){
  const files=items.map((p,i)=>new File([b64blob(FULL[p.id])],fname(p,i),{type:'image/jpeg'}));
  const text=caption(items);
  if(navigator.canShare&&navigator.canShare({files})){
    navigator.share({files,text}).then(()=>{if(S.selMode)exitSel()}).catch(e=>{if(e.name!=='AbortError')toast('Share failed: '+e.message)});
  }else{
    files.forEach(f=>downloadBlob(f,f.name));
    window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank');
    toast('Photos downloaded — attach them in WhatsApp',5000);
  }
}
async function share(ids){
  const items=ids.map(id=>S.photos.find(p=>p.id===id)).filter(Boolean);
  if(!items.length)return;
  if(items.every(p=>FULL[p.id])){doShare(items);return}
  busy(`Preparing ${items.length} photo${items.length>1?'s':''}…`);
  try{await loadFull(items.map(p=>p.id))}catch(e){busyOff();toast('Error: '+e.message,4000);return}
  busyOff();
  const ok=items.filter(p=>FULL[p.id]);if(!ok.length){toast('Photos not found — refresh');return}
  confirmBox('Photos ready',`${ok.length} photo${ok.length>1?'s':''} ready to send.`,'Share on WhatsApp','wa',()=>doShare(ok));
}

/* ===== PRINT ===== */
async function printPhotos(ids){
  const items=ids.map(id=>S.photos.find(p=>p.id===id)).filter(Boolean);
  if(!items.length)return;
  if(!items.every(p=>FULL[p.id])){busy(`Preparing ${items.length} photo${items.length>1?'s':''} for print…`);
    try{await loadFull(items.map(p=>p.id))}catch(e){busyOff();toast('Error: '+e.message,4000);return}busyOff()}
  const ok=items.filter(p=>FULL[p.id]);if(!ok.length)return toast('Photos not found — refresh');
  const pa=$('#printArea');
  pa.innerHTML=ok.map(p=>`<div class="pp"><div class="pph"><b>${esc(CO.name)}</b><span>📞 ${esc(CO.phone)}<br>${esc(CO.web)}</span></div>
    <img src="data:image/jpeg;base64,${FULL[p.id]}"><div class="ppt">${esc(p.title)}</div>${p.details?`<div class="ppd">${esc(p.details)}</div>`:''}<div class="ppc">${esc(p.cat)}</div></div>`).join('');
  await Promise.all([...pa.querySelectorAll('img')].map(i=>i.decode().catch(()=>{})));
  window.print();
}
window.addEventListener('afterprint',()=>{$('#printArea').innerHTML=''});

/* ===== DATA LOAD ===== */
async function loadAll(silent){
  if(!silent)busy('Loading…');
  try{
    const [c,ph]=await Promise.all([ensureCfg(),listPhotos()]);
    S.cfg=c;S.photos=ph;lsSet('epCfg',c);lsSet('epMeta',ph);S.cloudErr='';
  }catch(e){S.cloudErr=e.message;toast('Cloud error: '+e.message,5000)}
  busyOff();render();
}

/* ===== RENDER ===== */
function allCats(){const c=S.cfg.cats.slice();S.photos.forEach(p=>{if(p.cat&&!c.includes(p.cat))c.push(p.cat)});return c}
function tileHTML(p){return `<div class="tile${S.sel.has(p.id)?' sel':''}" data-id="${p.id}"><img data-t="${p.id}" alt=""><div class="cap">${esc(p.title)}</div><div class="chk">✓</div></div>`}
function match(p,q){return (p.title+' '+(p.details||'')+' '+p.cat).toLowerCase().includes(q)}

function render(){
  if(!S.user){renderLogin();return}
  $('#srch').style.display='';
  renderHeader();renderMain();renderBottom();
}
function renderHeader(){
  const h=$('#hrow');
  if(S.view==='cat'){
    const n=S.list.length;
    h.innerHTML=`<button class="hb" id="hBack">←</button><div class="t">${esc(S.cat==='__all'?'All Photos':S.cat)}<small>${n} photo${n!==1?'s':''}</small></div><button class="hb" id="hSel" title="Select">${S.selMode?'✕':'☑'}</button>`;
    $('#hBack').onclick=()=>closeTop();
    $('#hSel').onclick=()=>S.selMode?exitSel():enterSel();
  }else{
    h.innerHTML=`<div class="t">ENTRIX Product Photos<small>${esc(S.user.name)}${isAdmin()?' · Admin':''} · ${S.photos.length} photos</small></div><button class="hb" id="hRef" title="Refresh">⟳</button><button class="hb" id="hSet" title="Settings">⚙</button>`;
    $('#hRef').onclick=()=>loadAll();
    $('#hSet').onclick=openSettings;
  }
}
function renderMain(){
  const m=$('#main'),q=S.q.trim().toLowerCase();
  if(S.view==='cat'||q){
    let list=S.view==='cat'?(S.cat==='__all'?S.photos:S.photos.filter(p=>p.cat===S.cat)):S.photos;
    if(q)list=list.filter(p=>match(p,q));
    S.list=list;
    m.className=S.selMode?'selmode':'';
    m.innerHTML=(q&&S.view!=='cat'?`<div class="sec">${list.length} result${list.length!==1?'s':''}</div>`:'')+
      (list.length?`<div class="grid">${list.map(tileHTML).join('')}</div>`:`<div class="msg">${q?'No matching photos.':'No photos yet in this category.<br>Tap ＋ Upload to add.'}</div>`);
    m.querySelectorAll('.tile').forEach(t=>t.onclick=()=>tileTap(t.dataset.id));
    fillThumbs(list.map(p=>p.id));
    if(S.view==='cat')renderHeader();
    return;
  }
  m.className='';
  const cats=allCats(),covers=[];
  let html=(S.cloudErr?`<div class="banner">⚠ Cloud not connected: ${esc(S.cloudErr)}</div>`:'')+`<div class="row" data-c="__all"><div class="ph" style="display:flex;align-items:center;justify-content:center;font-size:22px">🖼</div><div class="n">All Photos</div><div class="c">${S.photos.length} ›</div></div><div class="sec">Categories</div>`;
  cats.forEach(c=>{const ps=S.photos.filter(p=>p.cat===c),cv=ps[0];if(cv)covers.push(cv.id);
    html+=`<div class="row${ps.length?'':' empty'}" data-c="${esc(c)}">${cv?`<img data-t="${cv.id}" alt="">`:'<div class="ph"></div>'}<div class="n">${esc(c)}</div><div class="c">${ps.length} ›</div></div>`});
  m.innerHTML=html;
  m.querySelectorAll('.row').forEach(r=>r.onclick=()=>openCat(r.dataset.c));
  fillThumbs(covers);
}
function renderBottom(){
  const fab=$('#fab'),bar=$('#bar');
  if(S.selMode){fab.style.display='none';bar.style.display='flex';
    const n=S.sel.size;
    bar.innerHTML=`<div class="n">${n} selected</div><button class="btn" id="bAll">All</button><button class="btn" id="bPrint" ${n?'':'disabled'}>🖨</button><button class="btn wa" id="bShare" ${n?'':'disabled'}>WhatsApp</button>`;
    $('#bAll').onclick=()=>{S.list.forEach(p=>S.sel.add(p.id));loadFull(S.list.map(p=>p.id)).catch(()=>{});renderMain();renderBottom()};
    $('#bShare').onclick=()=>share([...S.sel]);
    $('#bPrint').onclick=()=>printPhotos([...S.sel]);
  }else{bar.style.display='none';fab.style.display='block';fab.onclick=openUpload}
}
function openCat(c){S.view='cat';S.cat=c;S.q='';$('#q').value='';window.scrollTo(0,0);
  pushNav(()=>{S.view='home';S.cat=null;S.selMode=false;S.sel.clear();render()});render()}
function enterSel(){S.selMode=true;S.sel.clear();renderMain();renderBottom();renderHeader()}
function exitSel(){S.selMode=false;S.sel.clear();renderMain();renderBottom();if(S.view==='cat')renderHeader()}
function tileTap(id){
  if(S.selMode){S.sel.has(id)?S.sel.delete(id):(S.sel.add(id),loadFull([id]).catch(()=>{}));
    const t=document.querySelector(`.tile[data-id="${id}"]`);if(t)t.classList.toggle('sel',S.sel.has(id));renderBottom();return}
  openViewer(S.list.findIndex(p=>p.id===id));
}

/* ===== VIEWER ===== */
function openViewer(idx){
  if(idx<0)return;
  const list=S.list.slice();let i=idx;
  const ov=document.createElement('div');ov.className='viewer';document.body.appendChild(ov);
  pushNav(()=>ov.remove());
  function show(){
    const p=list[i];if(!p){closeTop();return}
    ov.innerHTML=`<div class="vtop"><button class="hb" data-a="x">✕</button><div class="t">${i+1} / ${list.length} · ${esc(p.cat)}</div></div>
      <div class="vimg"><img id="vI" alt="">${i>0?'<button class="nav l" data-a="p">‹</button>':''}${i<list.length-1?'<button class="nav r" data-a="n">›</button>':''}</div>
      <div class="vinfo"><b>${esc(p.title)}</b>${p.details?`<div class="d">${esc(p.details)}</div>`:''}<div class="m">Uploaded by ${esc(p.by||'—')} · ${fmtDate(p.at)}</div></div>
      <div class="vbtns"><button class="btn wa" data-a="s">Share on WhatsApp</button><button class="btn sm" data-a="pr" title="Print">🖨</button><button class="btn sm" data-a="d" title="Download">⬇</button>${isAdmin()?'<button class="btn sm" data-a="e" title="Edit">✏</button><button class="btn sm red" data-a="r" title="Delete">🗑</button>':''}</div>`;
    const im=ov.querySelector('#vI');
    if(THUMB[p.id])im.src='data:image/jpeg;base64,'+THUMB[p.id];
    const setFull=()=>{if(list[i]===p&&FULL[p.id])im.src='data:image/jpeg;base64,'+FULL[p.id]};
    if(FULL[p.id])setFull();else loadFull([p.id]).then(setFull).catch(e=>toast('Load error: '+e.message));
    if(!THUMB[p.id])loadImgs([p.id],'thumb').then(()=>{if(!FULL[p.id]&&THUMB[p.id]&&list[i]===p)im.src='data:image/jpeg;base64,'+THUMB[p.id]}).catch(()=>{});
    if(list[i+1])loadFull([list[i+1].id]).catch(()=>{});
    ov.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a,p));
  }
  function act(a,p){
    if(a==='x')closeTop();
    else if(a==='p'){i--;show()}
    else if(a==='n'){i++;show()}
    else if(a==='s')share([p.id]);
    else if(a==='pr')printPhotos([p.id]);
    else if(a==='d'){if(FULL[p.id])downloadBlob(b64blob(FULL[p.id]),fname(p,0));else toast('Still loading…')}
    else if(a==='e')openEdit(p,()=>show());
    else if(a==='r')confirmBox('Delete photo?',`"${p.title}" will be removed for the whole team. This cannot be undone.`,'Delete','red',async()=>{
      busy('Deleting…');
      try{await delPhoto(p.id);S.photos=S.photos.filter(x=>x.id!==p.id);lsSet('epMeta',S.photos);idb.del('thumb:'+p.id);idb.del('full:'+p.id);
        list.splice(i,1);busyOff();toast('Deleted');
        if(!list.length){await closeTop();}else{if(i>=list.length)i=list.length-1;show()}
        renderMain();renderHeader();
      }catch(e){busyOff();toast('Error: '+e.message,4000)}
    });
  }
  // swipe left/right
  let sx=null;
  ov.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
  ov.addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;
    if(Math.abs(dx)>60&&!e.target.closest('.vbtns')){if(dx<0&&i<list.length-1){i++;show()}else if(dx>0&&i>0){i--;show()}}},{passive:true});
  show();
}

/* ===== UPLOAD ===== */
function catOptions(sel){return allCats().map(c=>`<option ${c===sel?'selected':''}>${esc(c)}</option>`).join('')}
function openUpload(){
  const cur=S.view==='cat'&&S.cat!=='__all'?S.cat:'';
  const ov=modal(`<h3>Upload Product Photos</h3>
    <label>Category *</label><select id="uCat"><option value="">— Select category —</option>${catOptions(cur)}</select>
    <label>Product name / model *</label><input type="text" id="uTitle" placeholder="e.g. 40W All-in-One Solar Street Light">
    <label>Details (optional — sent with photo)</label><textarea id="uDet" placeholder="e.g. 12V 40Ah LiFePO4, 6m pole, 3 yr warranty"></textarea>
    <label>Photos *</label>
    <div class="pick"><button class="btn amb" id="uCam">📷 Camera</button><button class="btn amb" id="uGal">🖼 Gallery</button></div>
    <input type="file" id="fCam" accept="image/*" capture="environment" style="display:none">
    <input type="file" id="fGal" accept="image/*" multiple style="display:none">
    <div class="prev" id="uPrev"></div>
    <div class="chkl"><input type="checkbox" id="uMark" checked> <label for="uMark" style="margin:0;color:var(--txt);font-weight:400">Add ENTRIX name & phone on photo</label></div>
    <div class="err" id="uErr"></div>
    <div class="btns"><button class="btn" data-x>Cancel</button><button class="btn pri" id="uGo">Upload</button></div>`);
  let files=[];
  const prev=ov.querySelector('#uPrev');
  const addFiles=fl=>{[...fl].forEach(f=>{if(f.type.startsWith('image/')||/\.(jpe?g|png|webp|heic)$/i.test(f.name))files.push(f)});
    prev.innerHTML=files.map(f=>`<img src="${URL.createObjectURL(f)}">`).join('')+(files.length?`<div style="align-self:center;font-size:13px;color:var(--mut)">${files.length} photo${files.length>1?'s':''}</div>`:'')};
  ov.querySelector('#uCam').onclick=()=>ov.querySelector('#fCam').click();
  ov.querySelector('#uGal').onclick=()=>ov.querySelector('#fGal').click();
  ov.querySelector('#fCam').onchange=e=>{addFiles(e.target.files);e.target.value=''};
  ov.querySelector('#fGal').onchange=e=>{addFiles(e.target.files);e.target.value=''};
  ov.querySelector('[data-x]').onclick=()=>closeTop();
  ov.querySelector('#uGo').onclick=async()=>{
    const cat=ov.querySelector('#uCat').value,title=ov.querySelector('#uTitle').value.trim(),details=ov.querySelector('#uDet').value.trim(),mark=ov.querySelector('#uMark').checked,err=ov.querySelector('#uErr');
    if(!cat)return err.textContent='Select a category';
    if(!title)return err.textContent='Enter product name';
    if(!files.length)return err.textContent='Add at least one photo';
    let done=0;const fails=[];
    for(let k=0;k<files.length;k++){
      busy(`Uploading ${k+1} of ${files.length}…`);
      try{const {full,thumb}=await processFile(files[k],mark);
        const id=Date.now().toString(36)+Math.random().toString(36).slice(2,7);
        const meta={cat,title,details,by:S.user.name,at:Date.now()};
        await savePhoto(id,{...meta,thumb,full});
        THUMB[id]=thumb;FULL[id]=full;idb.set('thumb:'+id,thumb);idb.set('full:'+id,full);
        S.photos.unshift({id,...meta});done++;
      }catch(e){fails.push(files[k].name+': '+e.message)}
    }
    busyOff();lsSet('epMeta',S.photos);
    if(fails.length){err.textContent=`${done} uploaded, ${fails.length} failed — ${fails[0]}`;files=files.slice(done);renderMain();renderHeader();return}
    await closeTop();toast(`✓ ${done} photo${done>1?'s':''} uploaded`);
    if(S.view!=='cat'||(S.cat!==cat&&S.cat!=='__all')){if(S.view==='cat')await closeTop();openCat(cat)}else render();
  };
}

/* ===== EDIT (admin) ===== */
function openEdit(p,after){
  const ov=modal(`<h3>Edit Photo Info</h3>
    <label>Category</label><select id="eCat">${catOptions(p.cat)}</select>
    <label>Product name / model</label><input type="text" id="eTitle" value="${esc(p.title)}">
    <label>Details</label><textarea id="eDet">${esc(p.details||'')}</textarea>
    <div class="btns"><button class="btn" data-x>Cancel</button><button class="btn pri" id="eGo">Save</button></div>`);
  ov.querySelector('[data-x]').onclick=()=>closeTop();
  ov.querySelector('#eGo').onclick=async()=>{
    const o={cat:ov.querySelector('#eCat').value,title:ov.querySelector('#eTitle').value.trim(),details:ov.querySelector('#eDet').value.trim()};
    if(!o.title)return;
    busy('Saving…');
    try{await updPhoto(p.id,o);Object.assign(p,o);const q=S.photos.find(x=>x.id===p.id);if(q&&q!==p)Object.assign(q,o);lsSet('epMeta',S.photos);
      busyOff();await closeTop();toast('Saved');renderMain();after&&after()}
    catch(e){busyOff();toast('Error: '+e.message,4000)}
  };
}

/* ===== SETTINGS ===== */
function openSettings(){
  const counts={};S.photos.forEach(p=>counts[p.cat]=(counts[p.cat]||0)+1);
  const ov=modal(`<h3>Settings</h3>
    <div>Logged in as <b>${esc(S.user.name)}</b> (${isAdmin()?'Admin':'Sales'})</div>
    <div class="btns"><button class="btn" id="sName">Change name</button><button class="btn red" id="sOut">Logout</button></div>
    ${isAdmin()?`<label style="margin-top:18px">Sales team PIN</label>
      <div style="display:flex;gap:8px"><input type="tel" id="sPin" value="${esc(S.cfg.salesPin)}" maxlength="8"><button class="btn pri" id="sPinGo">Save</button></div>
      <label style="margin-top:18px">Categories</label>
      <div id="sCats">${allCats().map(c=>`<div class="crow"><div class="n">${esc(c)}</div><div class="c">${counts[c]||0}</div><button class="ib" data-r="${esc(c)}">✏</button><button class="ib" data-d="${esc(c)}">🗑</button></div>`).join('')}</div>
      <div style="display:flex;gap:8px;margin-top:10px"><input type="text" id="sNew" placeholder="New category name"><button class="btn amb" id="sAdd">Add</button></div><div class="err" id="sErr"></div>`:''}
    <div style="margin-top:16px;font-size:12px;color:var(--mut);text-align:center">ENTRIX Product Photos · Version <b>${APP_VERSION}</b> · ${APP_DATE}</div>
    <div class="btns"><button class="btn pri" data-x>Close</button></div>`);
  ov.querySelector('[data-x]').onclick=()=>closeTop();
  ov.querySelector('#sOut').onclick=async()=>{await closeTop();S.user=null;lsSet('epUser',null);render()};
  ov.querySelector('#sName').onclick=async()=>{await closeTop();promptBox('Your name',S.user.name,v=>{S.user.name=v;lsSet('epUser',S.user);render()})};
  if(!isAdmin())return;
  const sErr=ov.querySelector('#sErr');
  const run=async(msg,fn)=>{sErr.textContent='';busy(msg);try{await fn();S.cloudErr='';busyOff();await closeTop();render();openSettings();toast('✓ Saved')}catch(e){busyOff();sErr.textContent='Not saved — '+e.message;toast('Not saved: '+e.message,6000)}};
  ov.querySelector('#sPinGo').onclick=()=>{const v=ov.querySelector('#sPin').value.trim();if(!/^\d{4,8}$/.test(v))return toast('PIN must be 4–8 digits');if(v===ADMIN_PIN)return toast('Cannot be same as Admin PIN');
    run('Saving…',()=>editCfg(c=>{c.salesPin=v}))};
  ov.querySelector('#sNew').onkeydown=e=>{if(e.key==='Enter')ov.querySelector('#sAdd').click()};
  ov.querySelector('#sAdd').onclick=()=>{const v=ov.querySelector('#sNew').value.trim();if(!v){sErr.textContent='Type a category name first';return}if(allCats().some(c=>c.toLowerCase()===v.toLowerCase()))return toast('Already exists');
    run('Adding…',()=>editCfg(c=>{if(!c.cats.includes(v))c.cats.push(v)}))};
  ov.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{const name=b.dataset.d;
    if(!(counts[name]||0))return run('Deleting…',()=>editCfg(c=>{c.cats=c.cats.filter(x=>x!==name)}));
    await closeTop();openCatDelete(name)});
  ov.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{const old=b.dataset.r;await closeTop();
    promptBox('Rename category',old,async v=>{if(v===old)return;
      busy('Renaming…');
      try{await editCfg(c=>{const k=c.cats.indexOf(old);if(k>=0)c.cats[k]=v;else if(!c.cats.includes(v))c.cats.push(v)});
        const ps=S.photos.filter(p=>p.cat===old);
        for(let k=0;k<ps.length;k++){busy(`Moving photos ${k+1}/${ps.length}…`);await updPhoto(ps[k].id,{cat:v});ps[k].cat=v}
        lsSet('epMeta',S.photos);busyOff();toast('Renamed');render();
      }catch(e){busyOff();toast('Error: '+e.message,4000);loadAll(true)}
    })});
}

/* Delete a category that still has photos: move them elsewhere, or delete all (Admin PIN) */
function openCatDelete(name){
  const ps=S.photos.filter(p=>p.cat===name),others=allCats().filter(c=>c!==name),n=ps.length;
  const ov=modal(`<h3>Delete "${esc(name)}"</h3><div>This category has <b>${n}</b> photo${n>1?'s':''}.</div>
    ${others.length?`<label>Option 1 — Move photos to</label><select id="dTo">${others.map(c=>`<option>${esc(c)}</option>`).join('')}</select>
    <button class="btn amb full" id="dMove" style="margin-top:8px">Move ${n} photo${n>1?'s':''} & delete category</button>`:''}
    <label style="margin-top:18px">Option 2 — Delete category + all photos (enter Admin PIN)</label>
    <input type="password" id="dPin" inputmode="numeric" maxlength="8">
    <button class="btn red full" id="dAll" style="margin-top:8px">Delete everything</button>
    <div class="err" id="dErr"></div>
    <div class="btns"><button class="btn" data-x>Cancel</button></div>`);
  const err=ov.querySelector('#dErr');
  ov.querySelector('[data-x]').onclick=()=>closeTop();
  const finish=async msg=>{lsSet('epMeta',S.photos);busyOff();await closeTop();render();toast(msg);openSettings()};
  const fail=e=>{busyOff();err.textContent='Stopped — '+e.message;loadAll(true)};
  if(others.length)ov.querySelector('#dMove').onclick=async()=>{
    const to=ov.querySelector('#dTo').value;
    try{for(let k=0;k<n;k++){busy(`Moving ${k+1} of ${n}…`);await updPhoto(ps[k].id,{cat:to});ps[k].cat=to}
      busy('Deleting category…');await editCfg(c=>{c.cats=c.cats.filter(x=>x!==name)});
      await finish(`✓ Moved to ${to}, category deleted`)}catch(e){fail(e)}
  };
  ov.querySelector('#dAll').onclick=async()=>{
    if(ov.querySelector('#dPin').value.trim()!==ADMIN_PIN){err.textContent='Wrong Admin PIN';return}
    try{for(let k=0;k<n;k++){busy(`Deleting photo ${k+1} of ${n}…`);await delPhoto(ps[k].id);
        S.photos=S.photos.filter(x=>x.id!==ps[k].id);idb.del('thumb:'+ps[k].id);idb.del('full:'+ps[k].id)}
      busy('Deleting category…');await editCfg(c=>{c.cats=c.cats.filter(x=>x!==name)});
      await finish('✓ Category and photos deleted')}catch(e){fail(e)}
  };
}

/* ===== LOGIN ===== */
function renderLogin(){
  $('#srch').style.display='none';$('#fab').style.display='none';$('#bar').style.display='none';
  $('#hrow').innerHTML='<div class="t">ENTRIX Product Photos</div>';
  const last=lsGet('epLastName','');
  $('#main').innerHTML=`<div class="login"><div class="logo"><div class="a">ENTRIX <span>Innovation</span></div><div class="b">Product Photo Library</div><div class="b" style="font-size:12px;margin-top:4px">Version ${APP_VERSION} · ${APP_DATE}</div></div>
    <label>Your name</label><input type="text" id="lName" value="${esc(last)}" placeholder="e.g. Rahul">
    <label>PIN</label><input type="password" id="lPin" inputmode="numeric" maxlength="8">
    <div class="err" id="lErr"></div>
    <button class="btn pri full" id="lGo" style="margin-top:8px">Login</button></div>`;
  const go=async()=>{
    const name=$('#lName').value.trim(),pin=$('#lPin').value.trim(),err=$('#lErr');
    if(!name)return err.textContent='Enter your name';
    if(!pin)return err.textContent='Enter PIN';
    let role=null;
    if(pin===ADMIN_PIN)role='admin';
    else{busy('Checking…');let c=null;try{c=await ensureCfg()}catch(e){}busyOff();
      const sp=(c||lsGet('epCfg',null)||{}).salesPin||DEFAULT_SALES_PIN;if(c)S.cfg=c;
      if(pin===sp)role='sales'}
    if(!role)return err.textContent='Wrong PIN';
    S.user={name,role};lsSet('epUser',S.user);lsSet('epLastName',name);loadAll();
  };
  $('#lGo').onclick=go;$('#lPin').onkeydown=e=>{if(e.key==='Enter')go()};
}

/* ===== START ===== */
$('#q').addEventListener('input',e=>{S.q=e.target.value;if(S.selMode)exitSel();else renderMain()});
(function start(){
  S.user=lsGet('epUser',null);
  S.cfg=lsGet('epCfg',S.cfg);
  S.photos=lsGet('epMeta',[]);
  if(S.user){render();loadAll(S.photos.length>0)}else render();
})();
</script>
